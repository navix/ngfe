<div class="wrapper">
  <label>
    {{ label }}
    @if (requiredValidator?.isEnabled$ | async) {
      <span>*</span>
    }
  </label>
  <ng-content></ng-content>
  @if (control.touched$ | async) {
    <div class="errors">
      <ng-content select="[errors]"></ng-content>
    </div>
  }
  @if (control.pending) {
    <div class="errors">
      loading...
    </div>
  }
</div>
