<h2>Form</h2>

<div
  class="case"
  data-id="1-submit"
>
  <h4>1 - Submit</h4>
  <div>
    <form>
      <input
        [(model)]="value1"
        #c1="model"
        id="control-1"
        required
      />
      <button
        (anySubmit)="submitted1.set($event)"
        (invalidSubmit)="submitted1Invalid.set(true)"
        (validSubmit)="submitted1Valid.set(true)"
        id="form-1-submit"
      >
        Submit
      </button>
    </form>
  </div>
  <app-value-view
    [value]="c1.touched()"
    name="FIELD_TOUCHED"
  />
  <app-value-view
    [value]="submitted1()"
    name="SUBMITTED_VALIDITY"
  />
  <app-value-view
    [value]="submitted1Valid()"
    name="SUBMITTED_VALID"
  />
  <app-value-view
    [value]="submitted1Invalid()"
    name="SUBMITTED_INVALID"
  />
</div>

<div
  class="case"
  data-id="2-view-update-on-structure-update"
>
  <h4>2 - Update view on structure update</h4>
  <app-value-view
    [value]="sfForm.valid()"
    name="FORM_VALID__OUTSIDE_VIEW"
  />
  <div>
    <form #sfForm="form">
      @if (show2()) {
        <input
          [required]="required2()"
          [(model)]="value2"
        />
      }
      <div>
        Show:
        <input
          [(model)]="show2"
          id="show2"
          type="checkbox"
        />
      </div>
      <div>
        Required:
        <input
          [(model)]="required2"
          id="required2"
          type="checkbox"
        />
      </div>
    </form>
  </div>
  <app-value-view
    [value]="sfForm.valid()"
    name="FORM_VALID"
  />
</div>

<div
  class="case"
  data-id="3-form-submit"
>
  <h4>3 - Form Submit</h4>
  <div>
    <form
      (anySubmit)="submit3(); submitted3.set($event)"
      (invalidSubmit)="submitted3Invalid.set(true)"
      (validSubmit)="submitted3Valid.set(true)"
    >
      <input
        [(model)]="value3"
        #c3="model"
        id="control-3"
        required
      />
      <button
        id="form-3-submit"
        type="submit"
      >
        Submit
      </button>
    </form>
  </div>
  <app-value-view
    [value]="c3.touched()"
    name="FIELD_TOUCHED"
  />
  <app-value-view
    [value]="submitted3()"
    name="SUBMITTED_VALIDITY"
  />
  <app-value-view
    [value]="submitted3Valid()"
    name="SUBMITTED_VALID"
  />
  <app-value-view
    [value]="submitted3Invalid()"
    name="SUBMITTED_INVALID"
  />
</div>
